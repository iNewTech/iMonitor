<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient backgrounds -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    
    <!-- Advanced filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer glow ring -->
  <circle cx="70" cy="70" r="65" fill="none" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.3" filter="url(#glow)">
    <animate attributeName="r" values="65;68;65" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main background with modern design -->
  <circle cx="70" cy="70" r="60" fill="url(#primaryGradient)" filter="url(#dropShadow)"/>
  
  <!-- Glass effect overlay -->
  <circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <path d="M 25 45 Q 70 20, 115 45 Q 70 70, 25 45" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Central monitoring hub -->
  <circle cx="70" cy="70" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Job monitoring nodes -->
  <g id="jobNodes">
    <!-- Node 1 -->
    <circle cx="70" cy="35" r="6" fill="url(#accentGradient)" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="35" r="3" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Node 2 -->
    <circle cx="105" cy="70" r="6" fill="url(#glowGradient)" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="105" cy="70" r="3" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <!-- Node 3 -->
    <circle cx="70" cy="105" r="6" fill="url(#accentGradient)" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="70" cy="105" r="3" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Node 4 -->
    <circle cx="35" cy="70" r="6" fill="url(#glowGradient)" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="35" cy="70" r="3" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
  
  <!-- Dynamic connection lines -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="70" y1="41" x2="70" y2="59">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="99" y1="70" x2="81" y2="70">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="70" y1="99" x2="70" y2="81">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="41" y1="70" x2="59" y2="70">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
    </line>
  </g>
  
  <!-- Central core -->
  <circle cx="70" cy="70" r="8" fill="url(#accentGradient)" filter="url(#glow)"/>
  <circle cx="70" cy="70" r="4" fill="white" opacity="0.95"/>
  
  <!-- Data pulse rings -->
  <circle cx="70" cy="70" r="15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" opacity="0">
    <animate attributeName="r" values="15;35;55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="70" r="15" fill="none" stroke="rgba(6,182,212,0.6)" stroke-width="1" opacity="0">
    <animate attributeName="r" values="15;35;55" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Modern tech elements -->
  <g opacity="0.7">
    <rect x="45" y="45" width="2" height="8" rx="1" fill="rgba(255,255,255,0.8)">
      <animate attributeName="height" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="49" y="47" width="2" height="6" rx="1" fill="rgba(255,255,255,0.6)">
      <animate attributeName="height" values="6;10;6" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="53" y="44" width="2" height="10" rx="1" fill="rgba(255,255,255,0.8)">
      <animate attributeName="height" values="10;14;10" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Corner accent elements -->
  <circle cx="25" cy="25" r="2" fill="url(#glowGradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="115" r="2" fill="url(#accentGradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>