<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional gradients -->
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="alertGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="80" cy="80" r="75" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Server rack representation -->
  <g id="serverRack" transform="translate(25, 35)">
    <!-- Server cabinet -->
    <rect x="0" y="0" width="50" height="70" rx="4" fill="url(#serverGradient)" stroke="#4B5563" stroke-width="1"/>
    
    <!-- Server units -->
    <rect x="4" y="8" width="42" height="10" rx="2" fill="#374151" stroke="#6B7280" stroke-width="1"/>
    <rect x="4" y="22" width="42" height="10" rx="2" fill="#374151" stroke="#6B7280" stroke-width="1"/>
    <rect x="4" y="36" width="42" height="10" rx="2" fill="#374151" stroke="#6B7280" stroke-width="1"/>
    <rect x="4" y="50" width="42" height="10" rx="2" fill="#374151" stroke="#6B7280" stroke-width="1"/>
    
    <!-- Server status LEDs -->
    <circle cx="40" cy="13" r="2" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="27" r="2" fill="#3B82F6">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="41" r="2" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="55" r="2" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Port indicators -->
    <rect x="8" y="13" width="3" height="1" fill="#6B7280"/>
    <rect x="12" y="13" width="3" height="1" fill="#6B7280"/>
    <rect x="16" y="13" width="3" height="1" fill="#10B981"/>
    <rect x="20" y="13" width="3" height="1" fill="#3B82F6"/>
  </g>
  
  <!-- Monitor display -->
  <g id="monitor" transform="translate(85, 40)">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="65" height="45" rx="3" fill="#1F2937" stroke="#374151" stroke-width="2"/>
    <rect x="3" y="3" width="59" height="33" rx="2" fill="url(#screenGradient)"/>
    
    <!-- Monitor stand -->
    <rect x="28" y="45" width="9" height="8" fill="#374151"/>
    <rect x="22" y="53" width="21" height="3" rx="1" fill="#4B5563"/>
    
    <!-- Screen content - Live monitoring charts -->
    <g id="screenContent">
      <!-- CPU Usage Chart -->
      <text x="8" y="12" font-family="monospace" font-size="6" fill="#94A3B8">CPU %</text>
      <rect x="8" y="14" width="15" height="2" fill="#1E293B"/>
      <rect x="8" y="14" width="12" height="2" fill="url(#chartGradient)">
        <animate attributeName="width" values="12;8;15;10;12" dur="3s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Memory Usage -->
      <text x="8" y="22" font-family="monospace" font-size="6" fill="#94A3B8">MEM %</text>
      <rect x="8" y="24" width="15" height="2" fill="#1E293B"/>
      <rect x="8" y="24" width="9" height="2" fill="url(#chartGradient)">
        <animate attributeName="width" values="9;13;7;11;9" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Job count -->
      <text x="30" y="12" font-family="monospace" font-size="6" fill="#94A3B8">JOBS</text>
      <text x="30" y="20" font-family="monospace" font-size="8" fill="#10B981">
        <animate attributeName="fill" values="#10B981;#3B82F6;#10B981" dur="2s" repeatCount="indefinite"/>
        247
      </text>
      
      <!-- Active processes bars -->
      <rect x="30" y="24" width="2" height="4" fill="#10B981">
        <animate attributeName="height" values="4;8;6;4" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="33" y="24" width="2" height="6" fill="#3B82F6">
        <animate attributeName="height" values="6;4;8;6" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="24" width="2" height="5" fill="#8B5CF6">
        <animate attributeName="height" values="5;9;3;5" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="39" y="24" width="2" height="7" fill="#F59E0B">
        <animate attributeName="height" values="7;5;9;7" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Status indicators -->
      <circle cx="45" cy="12" r="2" fill="#10B981" filter="url(#glow)">
        <animate attributeName="fill" values="#10B981;#22C55E;#10B981" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="52" cy="12" r="2" fill="#3B82F6" filter="url(#glow)">
        <animate attributeName="fill" values="#3B82F6;#60A5FA;#3B82F6" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Alert indicator -->
      <polygon points="50,20 52,24 48,24" fill="url(#alertGradient)" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
  
  <!-- Connection lines showing monitoring -->
  <g stroke="#6B7280" stroke-width="2" fill="none" stroke-dasharray="3,2">
    <path d="M 75 50 Q 82 45, 85 50">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 75 65 Q 82 70, 85 65">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 75 80 Q 82 85, 85 80">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Data flow particles -->
  <g id="dataFlow">
    <circle cx="77" cy="50" r="1" fill="#10B981" opacity="0">
      <animate attributeName="cx" values="77;83" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="77" cy="65" r="1" fill="#3B82F6" opacity="0">
      <animate attributeName="cx" values="77;83" dur="1s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="77" cy="80" r="1" fill="#8B5CF6" opacity="0">
      <animate attributeName="cx" values="77;83" dur="1s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>
  
  <!-- Title text -->
  <text x="80" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#374151">
    IBMi Monitor
  </text>
</svg>