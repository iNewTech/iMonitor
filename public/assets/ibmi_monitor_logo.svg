<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Server/System representation -->
  <rect x="25" y="30" width="70" height="8" rx="4" fill="white" opacity="0.9"/>
  <rect x="25" y="42" width="70" height="8" rx="4" fill="white" opacity="0.7"/>
  <rect x="25" y="54" width="70" height="8" rx="4" fill="white" opacity="0.5"/>
  
  <!-- Monitor/Display element -->
  <rect x="30" y="70" width="60" height="35" rx="6" fill="white" opacity="0.15" stroke="white" stroke-width="2"/>
  <rect x="35" y="75" width="50" height="25" rx="3" fill="url(#accentGradient)"/>
  
  <!-- Activity indicators (representing job monitoring) -->
  <circle cx="42" cy="82" r="2" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="82" r="2" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="62" cy="82" r="2" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Data flow lines -->
  <path d="M42 88 L48 94 M52 88 L58 94 M62 88 L68 94" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Modern accent elements -->
  <circle cx="85" cy="35" r="3" fill="url(#accentGradient)" opacity="0.8"/>
  <circle cx="90" cy="45" r="2" fill="white" opacity="0.6"/>
  <rect x="20" y="85" width="4" height="4" rx="2" fill="url(#accentGradient)" opacity="0.7"/>
</svg>