<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IBMi System Monitor - Active Jobs</title>
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../node_modules/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <h1 class="mb-0 d-flex align-items-center">
                                <img src="assets/logo.svg" alt="IBMi Monitor" class="me-2" style="height: 40px; width: auto;">
                                <span>System Monitor</span>
                            </h1>
                            <button id="disconnect" class="btn btn-outline-danger">
                                <i class="bi bi-power me-2"></i>Disconnect
                            </button>
                        </div>
                        
                        <!-- Monitoring Panel -->
                        <div class="monitoring-panel">
                            <div class="row g-3 mb-4 align-items-center">
                                <div class="col-md-4">
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-clock"></i>
                                        </span>
                                        <select id="refresh-interval" class="form-select">
                                            <option value="5000">5 seconds</option>
                                            <option value="10000">10 seconds</option>
                                            <option value="30000">30 seconds</option>
                                            <option value="60000">1 minute</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                        <button id="start-monitoring" class="btn btn-success">
                                            <i class="bi bi-play-circle-fill me-2"></i>Start Monitoring
                                        </button>
                                        <button id="stop-monitoring" class="btn btn-danger">
                                            <i class="bi bi-stop-circle-fill me-2"></i>Stop Monitoring
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- System Stats Table -->
                            <div id="system-stats" class="table-responsive">
                                <table class="table table-hover table-striped align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th scope="col">Subsystem/Job</th>
                                            <th scope="col">Current User</th>
                                            <th scope="col">Type</th>
                                            <th scope="col">CPU %</th>
                                            <th scope="col">Function</th>
                                            <th scope="col">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Jobs will be dynamically inserted here -->
                                        <tr class="table-placeholder">
                                            <td colspan="7" class="text-center py-4 text-muted">
                                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                                No active jobs to display
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../node_modules/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="monitor.js"></script>
</body>
</html>
