<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IBMi System Monitor</title>
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../node_modules/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h1 class="text-center mb-4">
                            <img src="assets/logo.svg" alt="IBMi Monitor" class="me-2" style="height: 40px; width: auto;">
                            <span>IBMi System Monitor</span>
                        </h1>
                        
                        <!-- Connection Panel -->
                        <div class="saved-connections mb-4">
                            <select id="saved-connections" class="form-select mb-2">
                                <option value="">-- Select Saved Connection --</option>
                            </select>
                            <button id="delete-connection" class="btn btn-outline-danger btn-sm" style="display: none;">
                                <i class="bi bi-trash"></i> Delete Connection
                            </button>
                        </div>

                        <form id="connection-form" class="mb-4" novalidate>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="connection-name" placeholder="Connection Name" required>
                                <label for="connection-name">Connection Name *</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="system" placeholder="System Address" required>
                                <label for="system">System Address *</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="port" placeholder="Port" value="8076">
                                <label for="port">Port</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" placeholder="Username" required>
                                <label for="username">Username *</label>
                            </div>
                            <div class="form-floating mb-3">
                                <div class="input-group">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                                        <label for="password">Password *</label>
                                    </div>
                                    <button class="btn btn-outline-secondary d-flex align-items-center justify-content-center" type="button" id="toggle-password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" id="connect" class="btn btn-primary flex-grow-1">
                                    <i class="bi bi-plug-fill me-2"></i>Connect
                                </button>
                                <button type="button" id="save-connection" class="btn btn-outline-primary">
                                    <i class="bi bi-bookmark-plus"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../node_modules/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
